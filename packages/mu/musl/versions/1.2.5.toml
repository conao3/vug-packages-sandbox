version = "1.2.5"
patches = [
  "1.2.5-complex-multiply.patch",
  "1.2.5-stdio-write-skip-empty.patch",
]

[source]
url = "https://musl.libc.org/releases/musl-1.2.5.tar.gz"
sha256 = "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4"

[build]
kind = "autotools"
configure-flags = [
  "LDFLAGS=-rtlib=none",
  "LIBCC= ",
  "--syslibdir={out}/lib",
]

[dependencies]
build = [
  "make-bootstrap",
]
run = []

[check]
enabled = false
skip = []
